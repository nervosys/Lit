name: Nightly Security Tests

on:
  schedule:
    # Run at 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  security:
    name: Security & Adversarial Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [stable]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-nightly-${{ hashFiles('**/Cargo.lock') }}

      - name: Run adversarial tests (including ignored / long-running)
        run: |
          cargo test --test adversarial_test -- --include-ignored --test-threads=1 --nocapture

      - name: Run concurrency stress tests
        run: |
          cargo test --test concurrency_test -- --nocapture

      - name: Run network integration tests
        run: |
          cargo test --test network_integration_test -- --test-threads=1 --nocapture

      - name: Run performance benchmarks (release)
        run: |
          cargo test --test performance_benchmarks --release -- --nocapture --test-threads=1
