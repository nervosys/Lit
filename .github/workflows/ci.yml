name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result. Cancelling the others on the first
      # failure hides platform-specific problems behind whichever job happens
      # to fail first, turning one broken run into several rounds of fixes.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Build
        run: cargo build --verbose

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        # `--verbose` belongs to cargo; everything after `--` goes to the test
        # harness, which has no such option and exits before running anything.
        run: cargo test --verbose -- --test-threads=1

      - name: Build release
        run: cargo build --release

      - name: Generate docs
        run: cargo doc --no-deps
