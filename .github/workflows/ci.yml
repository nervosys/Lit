name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result. Cancelling the others on the first
      # failure hides platform-specific problems behind whichever job happens
      # to fail first, turning one broken run into several rounds of fixes.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Build
        run: cargo build --verbose

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        # `--verbose` belongs to cargo; everything after `--` goes to the test
        # harness, which has no such option and exits before running anything.
        run: cargo test --verbose -- --test-threads=1

      # The ignored test is ignored for runtime, not correctness: it exercises
      # the passphrase throttle, and each attempt that reaches verification
      # costs a 600k-iteration PBKDF2. Skipping it everywhere meant a real test
      # that nothing ever ran, so it runs here — on one platform, to buy the
      # coverage without paying for it three times.
      - name: Run ignored tests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --verbose -- --ignored --test-threads=1

      - name: Build release
        run: cargo build --release

      - name: Generate docs
        run: cargo doc --no-deps

  # The GUI and the website were built by nothing, which is how the Tauri
  # backend went two months without compiling: its dependency still named the
  # crate `lit` after it was renamed to `litvc`, and no job ever found out.
  gui:
    name: GUI backend
    # Windows so the Tauri build needs no system libraries; the point is to
    # catch the crate drifting away from the GUI, not to produce a bundle.
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gui/src-tauri/target
          key: ${{ runner.os }}-gui-${{ hashFiles('gui/src-tauri/Cargo.lock') }}

      - name: Check the Tauri backend
        run: cargo check --manifest-path gui/src-tauri/Cargo.toml

  website:
    name: Documentation website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        run: npm run build
